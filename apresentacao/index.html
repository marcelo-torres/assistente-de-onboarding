<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2b">
  <title>Assistente de Onboarding</title>
  <style>
    :root { color-scheme:dark; --ink:#f4f6fb; --muted:#a6b2c5; --cyan:#70e1dc; --line:rgba(208,221,244,.14); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; padding:24px; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 84% 17%,rgba(60,112,177,.23),transparent 34%),radial-gradient(ellipse at 11% 88%,rgba(39,139,139,.14),transparent 34%),linear-gradient(135deg,#111d30,#0d1727); }
    .cover { width:min(100%,1440px); height:min(calc(100vh - 48px),810px); min-height:500px; position:relative; display:flex; flex-direction:column; justify-content:center; padding:clamp(36px,8vw,112px); overflow:hidden; border:1px solid var(--line); border-radius:24px; background:linear-gradient(135deg,rgba(17,29,48,.64),rgba(13,23,39,.36)); box-shadow:0 32px 100px rgba(0,0,0,.4); }
    .cover::after { content:""; position:absolute; width:42vw; height:42vw; max-width:620px; max-height:620px; min-width:320px; min-height:320px; border:1px solid rgba(112,225,220,.12); border-radius:50%; right:-9%; top:50%; transform:translateY(-50%); box-shadow:0 0 0 55px rgba(112,225,220,.025),0 0 0 110px rgba(112,225,220,.02); pointer-events:none; }
    .eyebrow { margin:0 0 20px; color:var(--cyan); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { position:relative; z-index:1; max-width:850px; margin:0; font-size:clamp(52px,9vw,112px); font-weight:650; line-height:.98; letter-spacing:-.06em; }
    .subtitle { position:relative; z-index:1; margin:28px 0 0; color:#bdcad9; font-size:clamp(20px,3vw,32px); letter-spacing:-.025em; }
    .nav { position:fixed; right:clamp(20px,5vw,72px); bottom:clamp(18px,4vh,42px); z-index:2; }
    .next { display:inline-flex; align-items:center; gap:14px; padding:13px 18px; border:1px solid rgba(112,225,220,.4); border-radius:999px; background:rgba(16,29,47,.86); color:var(--cyan); text-decoration:none; font-size:13px; font-weight:650; box-shadow:0 8px 28px rgba(0,0,0,.2); transition:background .2s,transform .2s; }
    .next:hover,.next:focus-visible { background:rgba(32,55,78,.95); transform:translateY(-2px); outline:2px solid rgba(112,225,220,.45); outline-offset:3px; }
    .next span { font-size:19px; }
    @media(max-width:600px) { body{padding:0}.cover{height:100vh;min-height:0;border:0;border-radius:0;padding:32px 26px}.cover::after{right:-55%;min-width:260px;min-height:260px}.nav{right:22px;bottom:22px} }
    @media print { @page{size:13.333in 7.5in;margin:0} body{width:13.333in;height:7.5in;padding:0;background:#101a2b;print-color-adjust:exact;-webkit-print-color-adjust:exact}.cover{width:13.333in;height:7.5in;min-height:0;border:0;border-radius:0;box-shadow:none}.nav{display:none} }
  </style>
</head>
<body>
  <main class="cover">
    <p class="eyebrow">Aprendizado guiado por agentes</p>
    <h1>Assistente de<br>Onboarding</h1>
    <p class="subtitle">é na prática que se aprende</p>
  </main>
  <nav class="nav" aria-label="Navegação da apresentação">
    <a class="next" href="onboarding.html">Próximo <span aria-hidden="true">→</span></a>
  </nav>
</body>
</html>
